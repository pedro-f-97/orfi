[project]
name = "orfi"
version = "0.1.0"
description = "Organiza ficheiros por categorias."
requires-python = ">=3.11"

[project.scripts]
orfi = "orfi.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["orfi*"]

[tool.setuptools.package-data]
orfi = ["config.toml"]