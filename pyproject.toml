[project]
name = "orfi"
version = "1.2.0"
description = "Organiza ficheiros por categorias."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Pedro Ferreira" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/pedro-f-97/orfi"
Changelog = "https://github.com/pedro-f-97/orfi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]

[project.scripts]
orfi = "orfi.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["orfi*"]

[tool.setuptools.package-data]
orfi = ["config.toml"]

[tool.ruff.lint]
ignore = ["C408", "DTZ006", "DTZ005", "DTZ007"]